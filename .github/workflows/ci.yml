name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs and Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Check documentation and traceability
        run: node scripts/check-docs.mjs

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli lint api/openapi.yaml

  java:
    name: Java Backend
    runs-on: ubuntu-latest
    # A stuck test should fail fast, not hold a runner for GitHub's 6-hour default
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Maven verify
        # One re-run for failing tests: a test that passes on the re-run is recorded as flaky in
        # our own Flakewatch project (dogfooding, NFR-QUAL-004), never silently hidden.
        run: ./mvnw -B verify -Dsurefire.rerunFailingTestsCount=1

      - name: Upload our own test results to Flakewatch
        if: ${{ !cancelled() }}
        uses: ./action
        with:
          server-url: ${{ vars.FLAKEWATCH_URL }}
          token: ${{ secrets.FLAKEWATCH_SELF_INGEST_TOKEN }}
          files: '**/target/*-reports/TEST-*.xml'
          job-key: java

  mutation:
    name: Mutation Testing (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check whether core changed
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pull requests run PIT only when the detection logic or the build could change the
          # result. Pushes to main always run it, so main's score is always known.
          if [ -z "$BASE" ] || git diff --name-only "$BASE" HEAD | grep -qE '^(core/|pom\.xml$|\.github/workflows/ci\.yml$|scripts/pit-report\.mjs$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "core/ is unchanged; skipping mutation testing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Temurin JDK 25
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run PIT on core (fails below 75%)
        if: steps.changes.outputs.run == 'true'
        run: ./mvnw -B -pl core test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Show the mutants the tests missed
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        run: node scripts/pit-report.mjs core/target/pit-reports/mutations.xml

  web:
    name: Web Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Lint
        run: npm --prefix web run lint

      - name: Test
        run: npm --prefix web test

      - name: Build
        run: npm --prefix web run build

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Test the upload action
        run: npm --prefix action test

  image:
    name: Container Image & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        run: docker build -t flakewatch:${{ github.sha }} .

      - name: Start the image against PostgreSQL and smoke-test it
        # Builds alone don't prove the image starts. Run it the way Render does
        # (prod profile, real database) and check health and version.
        run: |
          docker network create fw
          docker run -d --name db --network fw \
            -e POSTGRES_DB=flakewatch -e POSTGRES_USER=flakewatch \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U flakewatch -d flakewatch && break
            sleep 2
          done
          docker run -d --name app --network fw -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/flakewatch \
            -e SPRING_DATASOURCE_USERNAME=flakewatch \
            flakewatch:${{ github.sha }}
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health/readiness && break
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then
              echo "The app container stopped."; exit 1
            fi
            sleep 2
          done
          bash deploy/smoke.sh http://localhost:8080

      - name: Show the app's logs
        if: failure()
        run: docker logs app || true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flakewatch:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
