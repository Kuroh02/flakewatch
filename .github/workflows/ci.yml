name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs and Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Check documentation and traceability
        run: node scripts/check-docs.mjs

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli lint api/openapi.yaml

  java:
    name: Java Backend
    runs-on: ubuntu-latest
    # A stuck test should fail fast, not hold a runner for GitHub's 6-hour default
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Maven verify
        # One re-run for failing tests: a test that passes on the re-run is recorded as flaky in
        # our own Flakewatch project (dogfooding, NFR-QUAL-004), never silently hidden.
        run: ./mvnw -B verify -Dsurefire.rerunFailingTestsCount=1

      - name: Upload our own test results to Flakewatch
        if: ${{ !cancelled() }}
        uses: ./action
        with:
          server-url: ${{ vars.FLAKEWATCH_URL }}
          token: ${{ secrets.FLAKEWATCH_SELF_INGEST_TOKEN }}
          files: '**/target/*-reports/TEST-*.xml'
          job-key: java

  web:
    name: Web Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Lint
        run: npm --prefix web run lint

      - name: Test
        run: npm --prefix web test

      - name: Build
        run: npm --prefix web run build

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Test the upload action
        run: npm --prefix action test

  e2e:
    name: End-to-end and Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start the app and its database (docker compose)
        run: |
          cp .env.example .env
          docker compose up --detach --build --wait --wait-timeout 300

      - name: Create the e2e projects
        run: |
          # Bootstrap prints each project's ingest token once. Mask it before anything else can
          # print it; it only exists in this throwaway database.
          out=$(docker compose run --rm -e FLAKEWATCH_WORKERS=0 app \
            --flakewatch.bootstrap.project=e2e --flakewatch.bootstrap.visibility=PUBLIC)
          token=$(grep -oE 'fw_ing_[A-Za-z0-9]+' <<<"$out" | head -n 1)
          if [ -z "$token" ]; then echo "::error::Bootstrap printed no token."; exit 1; fi
          echo "::add-mask::$token"
          echo "FW_E2E_TOKEN=$token" >> "$GITHUB_ENV"
          docker compose run --rm -e FLAKEWATCH_WORKERS=0 app \
            --flakewatch.bootstrap.project=e2e-hidden --flakewatch.bootstrap.visibility=PRIVATE > /dev/null

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium

      - name: Run the journeys (seeds the app through the upload API first)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm test

      - name: Show the app's logs
        if: failure()
        run: docker compose logs app --tail 200

      - name: Upload our own test results to Flakewatch
        if: ${{ !cancelled() }}
        uses: ./action
        with:
          server-url: ${{ vars.FLAKEWATCH_URL }}
          token: ${{ secrets.FLAKEWATCH_SELF_INGEST_TOKEN }}
          files: e2e/test-results/junit.xml
          job-key: e2e

  image:
    name: Container Image & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker image
        run: docker build -t flakewatch:${{ github.sha }} .

      - name: Start the image against PostgreSQL and smoke-test it
        # Builds alone don't prove the image starts. Run it the way Render does
        # (prod profile, real database) and check health and version.
        run: |
          docker network create fw
          docker run -d --name db --network fw \
            -e POSTGRES_DB=flakewatch -e POSTGRES_USER=flakewatch \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U flakewatch -d flakewatch && break
            sleep 2
          done
          docker run -d --name app --network fw -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/flakewatch \
            -e SPRING_DATASOURCE_USERNAME=flakewatch \
            flakewatch:${{ github.sha }}
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health/readiness && break
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then
              echo "The app container stopped."; exit 1
            fi
            sleep 2
          done
          bash deploy/smoke.sh http://localhost:8080

      - name: Show the app's logs
        if: failure()
        run: docker logs app || true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flakewatch:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
