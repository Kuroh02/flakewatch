services:
  db:
    image: postgres:17-alpine
    container_name: flakewatch-db
    environment:
      POSTGRES_DB: flakewatch
      POSTGRES_USER: flakewatch
      POSTGRES_PASSWORD: flakewatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flakewatch -d flakewatch"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flakewatch-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flakewatch
      SPRING_DATASOURCE_USERNAME: flakewatch
      SPRING_DATASOURCE_PASSWORD: flakewatch
      FLAKEWATCH_PUBLIC_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
