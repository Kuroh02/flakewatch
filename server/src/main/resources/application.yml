spring:
  application:
    name: flakewatch
  flyway:
    enabled: false
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000

server:
  tomcat:
    threads:
      max: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
logging:
  structured:
    format:
      console: ecs
